name: Verify resume and Agent Lee adapter
on:
  push:
    paths:
      - 'index.html'
      - 'agent-lee.js'
      - 'resume-fabric-adapters.js'
      - 'resume-management.html'
      - 'resume-general.html'
      - 'career-resumes.css'
      - 'tests/resume-fabric.test.cjs'
      - '.github/workflows/verify-resume-adapters.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'agent-lee.js'
      - 'resume-fabric-adapters.js'
      - 'resume-management.html'
      - 'resume-general.html'
      - 'career-resumes.css'
      - 'tests/resume-fabric.test.cjs'
      - '.github/workflows/verify-resume-adapters.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check source syntax
        run: |
          node --check agent-lee.js
          node --check resume-fabric-adapters.js
          node --check tests/resume-fabric.test.cjs
      - name: Test source contracts
        run: node --test tests/resume-fabric.test.cjs
